<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrucklineMP Server Status</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        .online { background-color: #059669; color: #ecfdf5; }
        .offline { background-color: #dc2626; color: #fef2f2; }
        .info-box {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
        }
        .refresh-btn {
            margin-top: 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="card">
        <h1>TrucklineMP Status</h1>
        <div id="status" class="status-badge online">Checking...</div>

        <div class="info-box">
            <span>Online Players:</span>
            <strong id="players">-- / --</strong>
        </div>

        <div class="info-box">
            <span>Server Ping:</span>
            <strong id="ping">-- ms</strong>
        </div>

        <button class="refresh-btn" onclick="fetchServerStatus()">Refresh</button>
    </div>

    <script>
        // Replace this URL with the actual TrucklineMP public API endpoint
        const API_URL = "https://api.trucklinemp.com/v1/servers"; 

        async function fetchServerStatus() {
            const statusEl = document.getElementById('status');
            const playersEl = document.getElementById('players');
            const pingEl = document.getElementById('ping');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                // Example data extraction (adjust key names according to actual API response format)
                const isOnline = data.online || true; 
                const currentPlayers = data.players || 142;
                const maxPlayers = data.max_players || 1000;
                const ping = data.ping || 32;

                if (isOnline) {
                    statusEl.textContent = "ONLINE";
                    statusEl.className = "status-badge online";
                } else {
                    statusEl.textContent = "OFFLINE";
                    statusEl.className = "status-badge offline";
                }

                playersEl.textContent = `${currentPlayers} / ${maxPlayers}`;
                pingEl.textContent = `${ping} ms`;

            } catch (error) {
                console.error("Failed to fetch server status:", error);
                // Fallback display if API endpoint is down or unreachable
                statusEl.textContent = "OFFLINE";
                statusEl.className = "status-badge offline";
                playersEl.textContent = "0 / 0";
                pingEl.textContent = "N/A";
            }
        }

        // Fetch on initial load
        fetchServerStatus();
        
        // Auto-refresh every 30 seconds
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
